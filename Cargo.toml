[workspace]
resolver = "2"
members = ["crates/memcached-protocol", "crates/memcached-core", "crates/mcp-server", "crates/diagnostics", "crates/mcrouter"]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2021"
license = "Apache-2.0"
authors = ["Burak Alkis <hakkiburakalks@gmail.com>"]
repository = "https://github.com/hakkiburakalks/memcache-route-mcp-server"
homepage = "https://github.com/hakkiburakalks/memcache-route-mcp-server"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "signal", "sync"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
