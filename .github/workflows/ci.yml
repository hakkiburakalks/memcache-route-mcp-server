name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release -p mcp-server
      - run: bash scripts/smoke.sh target/release/memcached-mcp

  compat:
    name: memcached ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.4", "1.5", "1.6"]
    services:
      memcached:
        image: memcached:${{ matrix.version }}
        ports: ["11211:11211"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p memcached-core --test live -- --nocapture
        env:
          MEMCACHED_ADDR: 127.0.0.1:11211
      - name: End-to-end tests of the MCP binary (stdio and HTTP)
        run: cargo test -p mcp-server --test e2e -- --nocapture
        env:
          MEMCACHED_ADDR: 127.0.0.1:11211
      - name: Start 4 MB memcached for the eviction test
        run: |
          docker run -d --name small -p 11217:11211 memcached:${{ matrix.version }} -m 4
          sleep 2
      - run: cargo test -p memcached-core --test eviction -- --nocapture
        env:
          MEMCACHED_SMALL_ADDR: 127.0.0.1:11217

  mcrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start mcrouter with two memcached backends
        run: |
          docker compose -f tests/compat/docker-compose.yml up -d mcrouter mcrouter-failover
          sleep 5
      - run: cargo test -p mcrouter --test live -- --nocapture
        env:
          MCROUTER_ADDR: 127.0.0.1:11218
      - name: mcrouter tools over MCP, including compare_destinations
        run: cargo test -p mcp-server --test e2e mcrouter -- --nocapture
        env:
          MCROUTER_ADDR: 127.0.0.1:11218
          MCROUTER_BACKENDS: 127.0.0.1:11219,127.0.0.1:11220,127.0.0.1:11221
      - name: Stop mc-a, then check behaviour with a dead destination
        run: |
          docker compose -f tests/compat/docker-compose.yml stop mc-a
          cargo test -p mcrouter --test failover -- --nocapture
        env:
          MCROUTER_PLAIN_ADDR: 127.0.0.1:11218
          MCROUTER_FAILOVER_ADDR: 127.0.0.1:11222

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memcached-mcp:ci .
      - name: Smoke test the image
        run: |
          test "$(docker image inspect memcached-mcp:ci --format '{{.Config.User}}')" = "65532:65532"
          # The server must start and reject a bad argument with its own message.
          docker run --rm memcached-mcp:ci --bogus 2>&1 | grep -q "unknown argument"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint deploy/helm/memcached-mcp --set 'allowlist={a:11211}' --set auth.existingSecret=s
      - name: Refuses to render without allowlist or credentials
        run: |
          ! helm template t deploy/helm/memcached-mcp
          ! helm template t deploy/helm/memcached-mcp --set 'allowlist={a:11211}'
      - run: helm template t deploy/helm/memcached-mcp --set 'allowlist={a:11211}' --set auth.existingSecret=s --set auth.mode=token > /dev/null

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
