name: MemCacheRoute CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release -p mcp-server
      - run: bash scripts/smoke.sh target/release/memcached-mcp

  compat:
    name: memcached ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.4.39", "1.5.22", "1.6.45"]
    services:
      memcached:
        image: memcached:${{ matrix.version }}
        ports: ["11211:11211"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p memcached-core --test live -- --nocapture
        env:
          MEMCACHED_ADDR: 127.0.0.1:11211
      - name: End-to-end tests of the MCP binary (stdio and HTTP)
        run: cargo test -p mcp-server --test e2e -- --nocapture
        env:
          MEMCACHED_ADDR: 127.0.0.1:11211
      - name: Start 4 MB memcached for the eviction test
        run: |
          docker run -d --name small -p 11217:11211 memcached:${{ matrix.version }} -m 4
          sleep 2
      - run: cargo test -p memcached-core --test eviction -- --nocapture
        env:
          MEMCACHED_SMALL_ADDR: 127.0.0.1:11217

  mcrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Start mcrouter with two memcached backends
        run: |
          docker compose -f tests/compat/docker-compose.yml up -d mcrouter mcrouter-failover
          sleep 5
      - run: cargo test -p mcrouter --test live -- --nocapture
        env:
          MCROUTER_ADDR: 127.0.0.1:11218
      - name: mcrouter tools over MCP, including compare_destinations
        run: cargo test -p mcp-server --test e2e mcrouter -- --nocapture
        env:
          MCROUTER_ADDR: 127.0.0.1:11218
          MCROUTER_BACKENDS: 127.0.0.1:11219,127.0.0.1:11220,127.0.0.1:11221
      - name: Stop mc-a, then check behaviour with a dead destination
        run: |
          docker compose -f tests/compat/docker-compose.yml stop mc-a
          cargo test -p mcrouter --test failover -- --nocapture
        env:
          MCROUTER_PLAIN_ADDR: 127.0.0.1:11218
          MCROUTER_FAILOVER_ADDR: 127.0.0.1:11222

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t memcached-mcp:ci .
      - name: Smoke test the image
        run: |
          test "$(docker image inspect memcached-mcp:ci --format '{{.Config.User}}')" = "65532:65532"
          # The server must start and reject a bad argument with its own message.
          docker run --rm memcached-mcp:ci --bogus 2>&1 | grep -q "unknown argument"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: helm lint deploy/helm/memcached-mcp --set 'allowlist={a:11211}' --set auth.existingSecret=s
      - name: Refuses to render without allowlist or credentials
        run: |
          ! helm template t deploy/helm/memcached-mcp
          ! helm template t deploy/helm/memcached-mcp --set 'allowlist={a:11211}'
      - run: helm template t deploy/helm/memcached-mcp --set 'allowlist={a:11211}' --set auth.existingSecret=s --set auth.mode=token > /dev/null
      - name: The Service's own DNS names are accepted in the Host check
        run: |
          out=$(helm template t deploy/helm/memcached-mcp -n prod --set 'allowlist={a:11211}' --set auth.existingSecret=s --set 'allowedHosts={mcp.example.com}')
          echo "$out" | grep -A1 MEMCACHED_MCP_HTTP_ALLOWED_HOSTS
          echo "$out" | grep -q 'value: "t-memcached-mcp,t-memcached-mcp.prod,t-memcached-mcp.prod.svc,t-memcached-mcp.prod.svc.cluster.local,mcp.example.com"'
      - name: NetworkPolicy is off by default and refuses an empty peer list
        run: |
          base="deploy/helm/memcached-mcp --set allowlist={a:11211} --set auth.existingSecret=s"
          ! helm template t $base | grep -q NetworkPolicy
          ! helm template t $base --set networkPolicy.enabled=true
          helm template t $base --set networkPolicy.enabled=true --set 'networkPolicy.allowFrom[0].podSelector.matchLabels.app=prom' | grep -A12 'kind: NetworkPolicy'

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Dependency licences are compatible with Apache-2.0
        run: python3 scripts/check-licenses.py
