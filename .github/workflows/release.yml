name: MemCacheRoute release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches chart appVersion
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          chart=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/memcached-mcp/Chart.yaml)
          test "v$chart" = "${GITHUB_REF_NAME}" || {
            echo "tag $GITHUB_REF_NAME does not match chart appVersion '$chart'" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p mcp-server --target ${{ matrix.target }}
      - name: Smoke test the binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/memcached-mcp
          [ -f "$bin.exe" ] && bin="$bin.exe"
          bash scripts/smoke.sh "$bin"
      - name: Package
        shell: bash
        run: |
          name=memcache-route-mcp-${{ matrix.target }}
          mkdir "$name"
          bin=target/${{ matrix.target }}/release/memcached-mcp
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md COMPATIBILITY.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          # Checksum next to every archive: `sha256sum -c <file>.sha256` verifies it.
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "CHECKSUM=$asset.sha256" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # keyless signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksum file
        run: cd dist && cat *.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS
      - name: Build provenance for the archives and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "${{ github.ref_name }}" in *-*) flag="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes $flag
