name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p mcp-server --target ${{ matrix.target }}
      - name: Smoke test the binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/memcached-mcp
          [ -f "$bin.exe" ] && bin="$bin.exe"
          bash scripts/smoke.sh "$bin"
      - name: Package
        shell: bash
        run: |
          name=memcached-mcp-${{ matrix.target }}
          mkdir "$name"
          bin=target/${{ matrix.target }}/release/memcached-mcp
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md COMPATIBILITY.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          case "${{ github.ref_name }}" in *-*) flag="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes $flag
