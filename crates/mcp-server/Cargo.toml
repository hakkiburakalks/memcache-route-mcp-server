[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "memcached-mcp"
path = "src/main.rs"

[dependencies]
memcached-core = { path = "../memcached-core" }
memcached-protocol = { path = "../memcached-protocol" }
diagnostics = { path = "../diagnostics" }
mcrouter = { path = "../mcrouter" }
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11.1"
getrandom = "0.4.3"

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
