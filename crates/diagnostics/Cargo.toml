[package]
name = "memcache-route-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure diagnostic, RCA, capacity, slab, timeline and cluster analysis for Memcached and mcrouter."
readme = "../../README.md"
keywords = ["memcached", "diagnostics", "observability", "rca", "cache"]
