{{- if and .Values.networkPolicy.egress.enabled (not .Values.networkPolicy.enabled) }}{{ fail "networkPolicy.egress.enabled requires networkPolicy.enabled=true" }}{{ end }}
{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.allowFrom }}{{ fail "networkPolicy.allowFrom must list at least one peer (an empty list would block everything)" }}{{ end }}
{{- if .Values.networkPolicy.egress.enabled }}
{{- if not .Values.networkPolicy.egress.rules }}{{ fail "networkPolicy.egress.rules must list at least one egress rule (DNS alone would not reach Memcached)" }}{{ end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memcached-mcp.fullname" . }}
  labels:
    {{- include "memcached-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memcached-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # DNS is required to resolve target names. Replace the selector if your cluster DNS differs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Destination peers and ports (for example TCP 11211/5000) are supplied by the operator.
    {{- toYaml .Values.networkPolicy.egress.rules | nindent 4 }}
  {{- end }}
{{- end }}
