{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.allowFrom }}{{ fail "networkPolicy.allowFrom must list at least one peer (an empty list would block everything)" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memcached-mcp.fullname" . }}
  labels:
    {{- include "memcached-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
