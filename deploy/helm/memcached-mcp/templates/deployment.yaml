{{- if not .Values.allowlist }}{{ fail "allowlist must list at least one host:port" }}{{ end }}
{{- if not .Values.auth.existingSecret }}{{ fail "auth.existingSecret is required: the server will not start without credentials" }}{{ end }}
{{- if not (has .Values.auth.mode (list "token" "file")) }}{{ fail "auth.mode must be token or file" }}{{ end }}
{{- with .Values.image.digest }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .) }}{{ fail "image.digest must be sha256:<64 lowercase hex characters>" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memcached-mcp.fullname" . }}
  labels:
    {{- include "memcached-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "memcached-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "memcached-mcp.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached-mcp
          image: "{{ include "memcached-mcp.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--http", "0.0.0.0:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # The pod network is plaintext: terminate TLS at an ingress or service mesh.
            - name: MEMCACHED_MCP_HTTP_ALLOW_PLAINTEXT
              value: "1"
            - name: MEMCACHED_MCP_ALLOWLIST
              value: {{ join "," .Values.allowlist | quote }}
            {{- if eq .Values.auth.mode "token" }}
            - name: MEMCACHED_MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.tokenKey }}
            {{- else }}
            - name: MEMCACHED_MCP_HTTP_TOKEN_FILE
              value: /etc/memcached-mcp/{{ .Values.auth.fileKey }}
            {{- end }}
            # The Service's own DNS names, so in-cluster clients and Prometheus pass the Host check.
            {{- $svc := include "memcached-mcp.fullname" . }}
            {{- $ns := .Release.Namespace }}
            {{- $own := list $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.%s" $svc $ns .Values.clusterDomain) }}
            - name: MEMCACHED_MCP_HTTP_ALLOWED_HOSTS
              value: {{ join "," (concat $own .Values.allowedHosts) | quote }}
            - name: MEMCACHED_MCP_MAX_UPSTREAM_CONNECTIONS
              value: {{ .Values.upstreamMaxConnections | quote }}
            - name: MEMCACHED_MCP_MEMORY_BUDGET_MB
              value: {{ .Values.memoryBudgetMb | quote }}
            - name: MEMCACHED_MCP_METRICS_MAX_CONCURRENT
              value: {{ .Values.metrics.maxConcurrent | quote }}
            - name: MEMCACHED_MCP_METRICS_FANOUT
              value: {{ .Values.metrics.fanout | quote }}
            - name: MEMCACHED_MCP_METRICS_TIMEOUT_MS
              value: {{ .Values.metrics.timeoutMs | quote }}
            - name: MEMCACHED_MCP_METRICS_CACHE_MS
              value: {{ .Values.metrics.cacheMs | quote }}
            {{- with .Values.metrics.memcachedTargets }}
            - name: MEMCACHED_MCP_METRICS_TARGETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.metrics.mcrouterTargets }}
            - name: MEMCACHED_MCP_MCROUTER_METRICS_TARGETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.destMap }}
            - name: MEMCACHED_MCP_DEST_MAP
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.write.enabled }}
            - name: MEMCACHED_MCP_ALLOW_WRITE
              value: "1"
            {{- with .Values.write.prefixes }}
            - name: MEMCACHED_MCP_WRITE_PREFIX
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.keySampling.enabled }}
            - name: MEMCACHED_MCP_ALLOW_KEY_SAMPLING
              value: "1"
            {{- if .Values.keySampling.allowKeyNames }}
            - name: MEMCACHED_MCP_ALLOW_KEY_NAMES
              value: "1"
            {{- end }}
            {{- end }}
          # /healthz needs no token and no Host header (kubelet probes use the pod IP). It reports
          # that the process is serving, not that upstream Memcached targets are reachable.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq .Values.auth.mode "file" }}
          volumeMounts:
            - name: auth
              mountPath: /etc/memcached-mcp
              readOnly: true
          {{- end }}
      {{- if eq .Values.auth.mode "file" }}
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            defaultMode: {{ .Values.auth.secretDefaultMode }}
            optional: false
            items:
              - key: {{ .Values.auth.fileKey }}
                path: {{ .Values.auth.fileKey }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
