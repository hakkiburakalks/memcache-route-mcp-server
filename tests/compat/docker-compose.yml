# One container per memcached version; host ports 11214 / 11215 / 11216.
services:
  mc14:
    image: memcached:1.4
    ports: ["11214:11211"]
  mc15:
    image: memcached:1.5
    ports: ["11215:11211"]
  mc16:
    image: memcached:1.6
    ports: ["11216:11211"]
  # 4 MB limit so the eviction test can fill it quickly.
  mc-small:
    image: memcached:1.6
    command: ["-m", "4"]
    ports: ["11217:11211"]
  # mcrouter in front of two memcached nodes; host port 11218.
  mc-a:
    image: memcached:1.6
  mc-b:
    image: memcached:1.6
  mcrouter:
    image: mcrouter/mcrouter
    command: ["mcrouter", "--config-file=/etc/mcrouter.json", "-p", "5000"]
    volumes: ["./mcrouter.json:/etc/mcrouter.json:ro"]
    ports: ["11218:5000"]
    depends_on: [mc-a, mc-b]
  # mcrouter with a FailoverRoute (primary mc-a, backup mc-b); host port 11222.
  mcrouter-failover:
    image: mcrouter/mcrouter
    command: ["mcrouter", "--config-file=/etc/mcrouter.json", "-p", "5000"]
    volumes: ["./mcrouter-failover.json:/etc/mcrouter.json:ro"]
    ports: ["11222:5000"]
    depends_on: [mc-a, mc-b]
